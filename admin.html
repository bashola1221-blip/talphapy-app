<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard — Talphapy</title>
    <style>
        :root { --bg-color: #0a1a3a; --card-bg: #15264d; --gold: #f0c040; --text-main: #ffffff; --text-muted: #94a3b8; --success: #10b981; --danger: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; padding: 20px 16px; }
        
        .admin-box { width: 100%; max-width: 600px; background: var(--card-bg); padding: 32px 24px; border-radius: 16px; border: 1px solid var(--gold); text-align: center; }
        .logo { font-size: 28px; font-weight: 800; color: var(--gold); margin-bottom: 8px; }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
        
        input { width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 10px; background: #0d1425; border: 1px solid rgba(255,255,255,0.1); color: white; font-size: 16px; outline: none; }
        input:focus { border-color: var(--gold); }
        
        .btn { width: 100%; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 16px; border: none; cursor: pointer; margin-bottom: 12px; }
        .btn-gold { background: var(--gold); color: var(--bg-color); }
        .btn-dark { background: rgba(255,255,255,0.1); color: var(--text-main); }
        .btn-success { background: var(--success); color: white; font-size: 14px; padding: 10px; margin: 0; width: auto; }
        
        /* User List Styles */
        .user-list { text-align: left; max-height: 60vh; overflow-y: auto; margin-top: 20px; border-top: 1px solid #333; padding-top: 20px; }
        .user-card { background: #0d1425; padding: 16px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
        .user-email { font-size: 14px; font-weight: 600; color: var(--text-main); }
        .user-stats { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-top: 8px; }
        .bg-locked { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .bg-unlocked { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div class="admin-box" id="login-section">
        <div class="logo">🔐 Admin Access</div>
        <div class="subtitle">Enter the secret password to continue.</div>
        <input type="password" id="admin-password" placeholder="Password">
        <button class="btn btn-gold" onclick="checkPassword()">Enter</button>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div class="admin-box" id="dashboard-section" style="display: none;">
        <div class="logo">🛠️ User Manager</div>
        <div class="subtitle">All registered users. Unlock those who paid.</div>
        
        <button class="btn btn-dark" onclick="loadUsers()">🔄 Refresh List</button>
        <button class="btn btn-dark" onclick="logoutAdmin()">Log Out</button>
        
        <div id="user-list-container" class="user-list">
            <div style="text-align:center; color: var(--text-muted);">Loading users...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://kbdchkkzoaoveryxzxdz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_ePAkGvIAevOmSg6wwn2BdA_PW9FRbhk";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // CHANGE THIS TO YOUR PASSWORD
        const ADMIN_PASSWORD = "BashirAdmin2026"; 

        function checkPassword() {
            const pass = document.getElementById('admin-password').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
                sessionStorage.setItem('isAdmin', 'true');
                loadUsers();
            } else {
                alert("Incorrect password!");
            }
        }

        if (sessionStorage.getItem('isAdmin') === 'true') {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
            loadUsers();
        }

        function logoutAdmin() {
            sessionStorage.removeItem('isAdmin');
            window.location.reload();
        }

        async function loadUsers() {
            const container = document.getElementById('user-list-container');
            container.innerHTML = '<div style="text-align:center; color: var(--text-muted);">Loading users...</div>';

            const { data: users, error } = await supabaseClient.rpc('admin_get_users', { 
                admin_password: ADMIN_PASSWORD 
            });

            if (error) {
                container.innerHTML = `<div style="color: var(--danger);">Error: ${error.message}</div>`;
                return;
            }

            if (!users || users.length === 0) {
                container.innerHTML = `<div style="text-align:center; color: var(--text-muted);">No users found.</div>`;
                return;
            }

            container.innerHTML = ''; // Clear loading

            users.forEach(user => {
                const isUnlocked = user.unlocked_s1;
                const badge = isUnlocked 
                    ? `<span class="status-badge bg-unlocked">✅ Unlocked</span>` 
                    : `<span class="status-badge bg-locked">🔒 Locked</span>`;
                
                const actionBtn = isUnlocked 
                    ? '' 
                    : `<button class="btn btn-success" onclick="unlockUser('${user.email}')">Unlock</button>`;

                container.innerHTML += `
                    <div class="user-card">
                        <div>
                            <div class="user-email">${user.email}</div>
                            <div class="user-stats">💎 ${user.diamonds || 0} | ⭐ ${user.xp || 0}</div>
                            ${badge}
                        </div>
                        <div>
                            ${actionBtn}
                        </div>
                    </div>
                `;
            });
        }

        async function unlockUser(email) {
            if(!confirm(`Are you sure you want to unlock Season 1 for ${email}?`)) return;

            const { data, error } = await supabaseClient.rpc('admin_unlock', { 
                user_email: email, 
                admin_password: ADMIN_PASSWORD 
            });

            if (error) {
                alert("Error: " + error.message);
            } else if (data === true) {
                alert(`✅ Successfully unlocked Season 1 for ${email}`);
                loadUsers(); // Refresh the list
            } else {
                alert("❌ User not found or password incorrect.");
            }
        }
    </script>
</body>
</html>
