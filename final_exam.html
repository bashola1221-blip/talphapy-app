<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Final Exam — Talphapy</title>
    <style>
        :root { --bg-color: #0a1a3a; --card-bg: #15264d; --gold: #f0c040; --text-main: #ffffff; --text-muted: #94a3b8; --success: #10b981; --danger: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; padding: 20px 16px; }
        .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; min-height: 100vh; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--gold); }
        .timer { font-size: 20px; font-weight: 800; color: var(--danger); }
        .progress { font-size: 14px; color: var(--text-muted); }
        
        .content { font-size: 16px; line-height: 1.6; color: #e2e8f0; flex-grow: 1; }
        
        .quiz-btn { display: block; width: 100%; padding: 16px; background: var(--card-bg); color: var(--text-main); border-radius: 12px; font-weight: 600; font-size: 16px; text-align: left; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; margin-bottom: 12px; }
        .quiz-btn:disabled { opacity: 0.6; }
        
        .btn-gold { display: block; width: 100%; padding: 16px; background: var(--gold); color: var(--bg-color); border-radius: 12px; font-weight: 700; font-size: 16px; text-align: center; border: none; cursor: pointer; }
        
        input[type="text"] { width: 100%; padding: 16px; margin-bottom: 20px; border-radius: 10px; background: #0d1425; border: 1px solid rgba(255,255,255,0.1); color: white; font-size: 16px; outline: none; text-align: center; }
        input[type="text"]:focus { border-color: var(--gold); }
    </style>
</head>
<body>
    <div class="app-container">
        
        <div id="name-entry" class="content" style="display: flex; flex-direction: column; justify-content: center; text-align: center;">
            <h2 style="color: var(--gold); margin-bottom: 10px;">🏆 Final Exam</h2>
            <p style="color: var(--text-muted); margin-bottom: 30px;">You are about to start a 10-minute timed exam.<br>You need <strong>80%</strong> to earn your certificate.</p>
            
            <p style="text-align: left; margin-bottom: 10px; font-weight: bold;">Enter your full name (It will appear exactly like this on your certificate):</p>
            <input type="text" id="real-name" placeholder="e.g. Bashir Adams">
            
            <button class="btn-gold" onclick="startExam()">Start Exam</button>
        </div>

        <div id="exam-screen" style="display: none; flex-direction: column; flex-grow: 1;">
            <div class="header">
                <div>
                    <div class="progress" id="question-progress">Question 1/10</div>
                    <div style="font-size: 12px; color: var(--text-muted);">Season 1 Final Exam</div>
                </div>
                <div class="timer" id="timer">10:00</div>
            </div>

            <div id="exam-content" class="content">
                <!-- Questions injected here -->
            </div>
        </div>
        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://kbdchkkzoaoveryxzxdz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_ePAkGvIAevOmSg6wwn2BdA_PW9FRbhk";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 15 Hard Questions (covers all 20 lessons)
        const questionBank = [
            { q: "What is the output of: print(10 // 3)?", options: ["3.3", "3", "4", "1"], answer: "3" },
            { q: "Which of these is a valid variable name?", options: ["2name", "my-name", "my_name", "my name"], answer: "my_name" },
            { q: "What does input() return?", options: ["Integer", "Float", "String", "Boolean"], answer: "String" },
            { q: "Which method makes a string all uppercase?", options: [".upper()", ".uppercase()", ".caps()", ".big()"], answer: ".upper()" },
            { q: "What is the output of: print(2 ** 3)?", options: ["6", "8", "9", "5"], answer: "8" },
            { q: "What is the index of the first item in a list?", options: ["1", "0", "-1", "a"], answer: "0" },
            { q: "How do you add an item to the end of a list?", options: [".add()", ".push()", ".append()", ".insert()"], answer: ".append()" },
            { q: "Which keyword is used to define a function?", options: ["def", "function", "fun", "create"], answer: "def" },
            { q: "What does random.randint(1, 10) do?", options: ["Picks a random number between 1 and 10", "Prints 1 to 10", "Adds 1 and 10", "Error"], answer: "Picks a random number between 1 and 10" },
            { q: "What brackets are used to create a dictionary?", options: ["( )", "[ ]", "{ }", "< >"], answer: "{ }" },
            { q: "What does the 'break' keyword do?", options: ["Pauses the loop", "Exits the loop immediately", "Restarts the loop", "Deletes the loop"], answer: "Exits the loop immediately" },
            { q: "If score = 65, what is the output of: if score >= 70: 'A' elif score >= 60: 'B' else: 'C'?", options: ["A", "B", "C", "Nothing"], answer: "B" },
            { q: "What does 'except ValueError:' do?", options: ["Catches number conversion errors", "Catches syntax errors", "Creates a variable", "Loops the code"], answer: "Catches number conversion errors" },
            { q: "What is the output of: print(len([10, 20, 30]))?", options: ["2", "3", "30", "Error"], answer: "3" },
            { q: "What does str(5) do?", options: ["Turns 5 into \"5\"", "Turns \"5\" into 5", "Doubles 5", "Nothing"], answer: "Turns 5 into \"5\"" }
        ];

        let selectedQuestions = [];
        let currentQuestion = 0;
        let score = 0;
        let timeLeft = 600;
        let timerInterval;

        async function checkExamLock() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if(!user) return window.location.href = "login.html";

            let { data: profile } = await supabaseClient.from('profiles').select('completed_lessons').eq('id', user.id).single();
            let completed = profile.completed_lessons || [];
            
            const allLessons = ['lesson1','lesson2','lesson3','lesson4','lesson5','lesson6','lesson7','lesson8','lesson9','lesson10','lesson11','lesson12','lesson13','lesson14','lesson15','lesson16','lesson17','lesson18','lesson19','lesson20'];
            
            if (!allLessons.every(l => completed.includes(l))) {
                alert("You must complete all 20 lessons before taking the final exam!");
                window.location.href = "season1.html";
            }
        }
        checkExamLock();

        async function startExam() {
            const nameInput = document.getElementById('real-name').value.trim();
            if (nameInput.length < 3) {
                alert("Please enter your full name.");
                return;
            }

            const { data: { user } } = await supabaseClient.auth.getUser();
            if(!user) return window.location.href = "login.html";

            await supabaseClient.from('profiles').update({ certificate_name: nameInput }).eq('id', user.id);

            document.getElementById('name-entry').style.display = 'none';
            document.getElementById('exam-screen').style.display = 'flex';

            const shuffled = questionBank.sort(() => 0.5 - Math.random());
            selectedQuestions = shuffled.slice(0, 10);

            timerInterval = setInterval(() => {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                document.getElementById('timer').innerText = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("Time is up! Your exam has been submitted.");
                    finishExam();
                }
            }, 1000);

            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestion >= selectedQuestions.length) {
                finishExam();
                return;
            }

            const qData = selectedQuestions[currentQuestion];
            document.getElementById('question-progress').innerText = `Question ${currentQuestion + 1}/${selectedQuestions.length}`;
            
            let html = `<p style="font-size: 18px; font-weight: 600; margin-bottom: 20px;">${qData.q}</p>`;
            qData.options.forEach(opt => {
                html += `<button class="quiz-btn" onclick="checkAnswer('${opt}', this)">${opt}</button>`;
            });

            document.getElementById('exam-content').innerHTML = html;
        }

        function checkAnswer(selected, btn) {
            const qData = selectedQuestions[currentQuestion];
            const allBtns = document.querySelectorAll('.quiz-btn');
            allBtns.forEach(b => b.disabled = true);

            if (selected === qData.answer) {
                btn.style.background = 'var(--success)';
                score++;
            } else {
                btn.style.background = 'var(--danger)';
                allBtns.forEach(b => {
                    if(b.innerText === qData.answer) b.style.background = 'var(--success)';
                });
            }

            setTimeout(() => {
                currentQuestion++;
                loadQuestion();
            }, 1000);
        }

        async function finishExam() {
            clearInterval(timerInterval);
            const percentage = (score / 10) * 100;
            const passed = percentage >= 80;

            const { data: { user } } = await supabaseClient.auth.getUser();
            
            let html = `
                <div style="text-align: center; padding: 40px 20px; background: var(--card-bg); border-radius: 16px; border: 2px solid ${passed ? 'var(--gold)' : 'var(--danger)'};">
                    <h2 style="font-size: 32px; color: ${passed ? 'var(--gold)' : 'var(--danger)'}; margin-bottom: 10px;">
                        ${passed ? '🏆 You Passed!' : '📉 You Failed'}
                    </h2>
                    <p style="font-size: 18px; margin-bottom: 20px;">You scored <strong>${score} / 10</strong> (${percentage}%)</p>
                    <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 24px;">${passed ? 'You are now eligible for your certificate.' : 'You need 80% to earn the certificate. Try again!'}</p>
            `;

            if (passed) {
                await supabaseClient.from('profiles').update({ 
                    certificate_earned: true,
                    certificate_date: new Date().toISOString().split('T')[0]
                }).eq('id', user.id);

                html += `<a href="certificate.html" class="btn-gold" style="text-decoration: none;">🎓 View Certificate</a>`;
            } else {
                html += `<a href="final_exam.html" class="btn-gold" style="text-decoration: none; background: var(--danger); color: white;">🔄 Retry Exam</a>`;
                html += `<a href="season1.html" style="display: block; margin-top: 16px; color: var(--text-muted); text-decoration: none;">Back to Lessons</a>`;
            }

            html += `</div>`;
            document.getElementById('exam-content').innerHTML = html;
            document.getElementById('timer').style.display = 'none';
        }
    </script>
</body>
</html>
