<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Certificate — Talphapy</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { 
            --bg-color: #0a1a3a; 
            --cert-bg: #fdfbf5; 
            --gold: #c5a059; 
            --dark-blue: #0a1a3a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px 16px; }
        
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; align-items: center; gap: 20px; }

        /* THE CERTIFICATE BOX */
        #certificate-box {
            width: 100%;
            background: var(--cert-bg);
            color: #333;
            padding: 40px 15px; 
            border: 10px solid var(--dark-blue);
            outline: 2px solid var(--gold);
            outline-offset: -6px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Decorative inner corners */
        .corner-tl, .corner-tr, .corner-bl, .corner-br {
            position: absolute; width: 30px; height: 30px; border: 2px solid var(--gold); pointer-events: none;
        }
        .corner-tl { top: 12px; left: 12px; border-right: none; border-bottom: none; }
        .corner-tr { top: 12px; right: 12px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 12px; left: 12px; border-right: none; border-top: none; }
        .corner-br { bottom: 12px; right: 12px; border-left: none; border-top: none; }

        /* TEXT STYLING */
        .cert-header { 
            font-family: "Georgia", serif; 
            font-size: 32px; 
            font-weight: 800; 
            letter-spacing: 2px; 
            color: var(--dark-blue); 
            margin-bottom: 5px; 
            text-transform: uppercase; 
            word-wrap: break-word;
        }
        .cert-sub { font-size: 12px; color: #555; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 20px; }
        
        .cert-name { 
            font-family: "Georgia", serif; 
            font-size: 36px; 
            font-weight: 700; 
            color: var(--gold); 
            text-transform: uppercase; 
            letter-spacing: 3px;
            margin-bottom: 15px; 
            font-style: italic;
            word-wrap: break-word;
        }
        
        /* DECORATIVE DIVIDER */
        .divider {
            display: flex; align-items: center; justify-content: center; gap: 10px; margin: 15px 0;
        }
        .divider-line { height: 1px; width: 60px; background: var(--gold); }
        .divider-diamond { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); }

        .cert-text { font-size: 14px; color: #444; line-height: 1.6; max-width: 90%; margin: 0 auto 30px auto; }
        
        /* 3-COLUMN FOOTER */
        .cert-footer { 
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; 
            align-items: end; 
            margin-top: 20px; 
            padding: 0 5px;
        }
        
        .signature { 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            height: 90px;
        }
        
        .signature-img {
            max-width: 90%; 
            height: auto;
            max-height: 40px; 
            object-fit: contain;
            margin-bottom: 5px;
        }
        
        .sig-line { width: 100%; height: 1px; background: #333; margin-bottom: 6px; }
        .gold-line { background: var(--gold); height: 2px; }
        .sig-name { font-size: 14px; font-weight: 700; color: var(--dark-blue); }
        .sig-title { font-size: 10px; color: #666; }

        /* GOLD SEAL */
        .seal {
            width: 75px; height: 75px;
            background: linear-gradient(135deg, #f6d365 0%, #c5a059 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            position: relative;
            border: 2px dashed #fff;
        }
        .seal-inner {
            width: 55px; height: 55px;
            border: 2px solid var(--dark-blue);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            color: var(--dark-blue);
        }
        
        .date-container { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 90px;}
        .date-title { font-size: 14px; font-weight: 700; color: var(--dark-blue); margin-bottom: 2px;}
        .date-subtitle { font-size: 10px; color: #666; margin-bottom: 6px;}
        .date-text { font-size: 14px; font-weight: 700; color: var(--dark-blue); margin-top: 6px;}

        .cert-id { font-size: 10px; color: #888; margin-top: 30px; font-family: monospace; letter-spacing: 1px; }

        .btn-gold { display: block; width: 100%; max-width: 400px; padding: 16px; background: var(--gold); color: #fff; border-radius: 12px; font-weight: 700; font-size: 16px; text-align: center; border: none; cursor: pointer; }
        .loading-text { color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        
        <div id="certificate-box">
            <!-- Corner Decorations -->
            <div class="corner-tl"></div>
            <div class="corner-tr"></div>
            <div class="corner-bl"></div>
            <div class="corner-br"></div>

            <div class="cert-header">CERTIFICATE</div>
            <div class="cert-sub">OF COMPLETION</div>
            
            <div style="font-size: 14px; color: #555; margin-bottom: 10px;">This certifies that</div>
            
            <div class="cert-name" id="student-name">Loading...</div>
            
            <div class="divider">
                <div class="divider-line"></div>
                <div class="divider-diamond"></div>
                <div class="divider-diamond" style="width: 4px; height: 4px;"></div>
                <div class="divider-diamond"></div>
                <div class="divider-line"></div>
            </div>

            <div class="cert-text">
                has successfully completed the <strong>Python Foundations</strong> curriculum at Talphapy, demonstrating a solid understanding of variables, loops, conditionals, functions, and data structures.
            </div>
            
            <div class="cert-footer">
                <!-- Column 1: Signature -->
                <div class="signature">
                    <img src="https://i.postimg.cc/0yBXM725/IMG-20261102-WA6465-3-removebg-preview.png" crossorigin="anonymous" class="signature-img" alt="Signature">
                    <div class="sig-line"></div>
                    <!-- TEXT CHANGED HERE -->
                    <div class="sig-name">Talphapy</div>
                    <div class="sig-title">Founder, Talpha</div>
                </div>
                
                <!-- Column 2: Seal -->
                <div class="seal">
                    <div class="seal-inner">★</div>
                </div>
                
                <!-- Column 3: Date -->
                <div class="date-container">
                    <div class="date-title">Date</div>
                    <div class="date-subtitle">Issued</div>
                    <div class="sig-line gold-line"></div>
                    <div class="date-text" id="date-text"></div>
                </div>
            </div>
            
            <div class="cert-id" id="cert-id">Certificate ID: Loading...</div>
        </div>

        <button class="btn-gold" onclick="downloadCertificate()" id="download-btn">📥 Download Certificate</button>
        <div id="download-status" class="loading-text"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://kbdchkkzoaoveryxzxdz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_ePAkGvIAevOmSg6wwn2BdA_PW9FRbhk";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadCertificate() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if(!user) return window.location.href = "login.html";

            let { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();

            if (!profile || !profile.certificate_earned) {
                alert("You haven't passed the final exam yet!");
                window.location.href = "final_exam.html";
                return;
            }

            let realName = profile.certificate_name;
            if (!realName || realName === "Talphapy Student") {
                realName = prompt("Please enter your full name as you want it on your certificate:");
                if (realName && realName.trim().length > 2) {
                    await supabaseClient.from('profiles').update({ certificate_name: realName }).eq('id', user.id);
                } else {
                    realName = "Talphapy Student";
                }
            }
            
            let dateString = "";
            if (profile.certificate_date) {
                const date = new Date(profile.certificate_date);
                dateString = date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
            } else {
                dateString = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
            }

            const certId = "TAL-" + user.id.substring(0, 8).toUpperCase();

            document.getElementById('student-name').innerText = realName;
            document.getElementById('date-text').innerText = dateString;
            document.getElementById('cert-id').innerText = "Certificate ID: " + certId;
        }

        function downloadCertificate() {
            const btn = document.getElementById('download-btn');
            const status = document.getElementById('download-status');
            btn.style.display = 'none';
            status.innerText = "Generating high-quality image... Please wait.";

            const certBox = document.getElementById('certificate-box');

            html2canvas(certBox, { scale: 2, useCORS: true }).then(canvas => {
                const image = canvas.toDataURL("image/png");
                const link = document.createElement('a');
                link.download = 'Talphapy_Certificate.png';
                link.href = image;
                link.click();

                btn.style.display = 'block';
                status.innerText = "Downloaded successfully! Check your phone's files/gallery.";
            }).catch(err => {
                btn.style.display = 'block';
                status.innerText = "Failed to generate image. Please try again.";
            });
        }

        loadCertificate();
    </script>
</body>
</html>
