<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talphapy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a1a3a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #f0c040;
            font-size: 32px;
            margin-bottom: 12px;
        }
        p {
            color: #c0d0e0;
            font-size: 16px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            margin-top: 24px;
            padding: 14px 32px;
            background: #f0c040;
            color: #0a1a3a;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🐍 Talphapy</h1>
        <p>Learn Python step by step.<br>Simple, clear, hands-on.</p>
        <a href="https://t.me/Talphapy_bot" class="btn">Open Bot</a>
    </div>
</body>
