<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talphapy — Learn Python</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a1a3a">
    <style>
        :root { --bg-color: #0a1a3a; --card-bg: #15264d; --gold: #f0c040; --text-main: #ffffff; --text-muted: #94a3b8; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; padding: 20px 16px; }
        
        .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px; }
        header { text-align: center; margin-bottom: 10px; margin-top: 20px; }
        .logo { font-size: 32px; font-weight: 800; color: var(--gold); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .welcome-text { color: var(--text-muted); font-size: 15px; margin-top: 8px; }

        .stats-bar { background: var(--card-bg); border-radius: 12px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-item { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 16px; }

        .season-card { background: var(--card-bg); border-radius: 16px; padding: 24px; border: 1px solid rgba(255,255,255,0.05); position: relative; overflow: hidden; }
        .season-card h2 { font-size: 20px; margin-bottom: 6px; color: var(--gold); }
        .season-card p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; line-height: 1.4; }
        .season-card.locked h2 { color: var(--text-muted); }

        .btn { display: inline-block; width: 100%; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 16px; text-align: center; text-decoration: none; border: none; }
        .btn-gold { background: var(--gold); color: var(--bg-color); }
        .btn-dark { background: rgba(255,255,255,0.1); color: var(--text-main); }
        
        .logout-btn { background: none; border: none; color: var(--text-muted); font-size: 12px; text-decoration: underline; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header>
            <div class="logo">🐍 Talphapy</div>
            <div class="welcome-text" id="welcome-name">Loading...</div>
        </header>

        <div class="stats-bar">
            <div class="stat-item">💎 <span id="user-diamonds">0</span></div>
            <div class="stat-item">⭐ <span id="user-xp">0</span></div>
            <div class="stat-item">🔥 <span>1</span></div>
        </div>

        <div class="season-card">
            <h2>Season 1</h2>
            <p>Python Foundations. Master the basics — variables, loops, and logic.</p>
            <a href="season1.html" class="btn btn-gold">Start Learning</a>
        </div>

        <div class="season-card locked">
            <h2>🔒 Season 2</h2>
            <p>Build Real Apps. Create calculators, games, and tools.</p>
            <a href="#" class="btn btn-dark">Locked</a>
        </div>
        
        <center>
            <button class="logout-btn" onclick="logout()">Log out</button>
        </center>

    </div>

    <script src="nav.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        const SUPABASE_URL = "https://kbdchkkzoaoveryxzxdzd.supabase.co";
        const SUPABASE_KEY = "sb_publishable_ePAkGvIAevOmSg6wwn2BdA_PW9FRbhk";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadData() {
            // Check if user is logged in
            const { data: { user } } = await supabaseClient.auth.getUser();
            
            if (!user) {
                window.location.href = "login.html"; // Send to login if not
                return;
            }

            document.getElementById('welcome-name').innerText = "Welcome, " + user.email.split('@')[0];

            // Fetch profile from database
            let { data: profile, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();

            // Create profile if it doesn't exist
            if (!profile) {
                await supabaseClient.from('profiles').insert([{ id: user.id, diamonds: 0, xp: 0 }]);
                profile = { diamonds: 0, xp: 0 };
            }

            // Update UI
            document.getElementById('user-diamonds').innerText = profile.diamonds;
            document.getElementById('user-xp').innerText = profile.xp;
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = "login.html";
        }

        loadData();
    </script>
</body>
</html>
