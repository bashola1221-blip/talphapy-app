<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Season 1 — Talphapy</title>
    <style>
        :root { --bg-color: #0a1a3a; --card-bg: #15264d; --gold: #f0c040; --text-main: #ffffff; --text-muted: #94a3b8; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; padding: 20px 16px; }
        
        .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
        .top-bar { display: flex; align-items: center; margin-bottom: 10px; margin-top: 10px; }
        .back-btn { color: var(--gold); text-decoration: none; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .page-title { font-size: 26px; font-weight: 800; color: var(--gold); margin-bottom: 4px; }
        .page-subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 16px; }

        .lesson-card { background: var(--card-bg); border-radius: 12px; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: var(--text-main); border: 1px solid rgba(255,255,255,0.05); transition: transform 0.2s; }
        .lesson-card:active { transform: scale(0.98); }
        .lesson-info h3 { font-size: 16px; margin-bottom: 4px; }
        .lesson-info p { font-size: 12px; color: var(--text-muted); }
        .lesson-icon { font-size: 20px; }

        /* Locked Lesson Styling */
        .lesson-card.locked { opacity: 0.5; pointer-events: none; }
        .lesson-card.locked h3 { color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="top-bar">
            <a href="index.html" class="back-btn">← Back</a>
        </div>

        <div class="page-title">Season 1</div>
        <div class="page-subtitle">Python Foundations</div>

        <!-- Lesson 1 -->
        <a href="lesson1.html" class="lesson-card" id="card-lesson1">
            <div class="lesson-info">
                <h3>1. Your First Python Program</h3>
                <p>Print, variables, and basic rules</p>
            </div>
            <div class="lesson-icon" id="icon-lesson1">📘</div>
        </a>

        <!-- Lesson 2 -->
        <a href="lesson2.html" class="lesson-card" id="card-lesson2">
            <div class="lesson-info">
                <h3>2. Variables & Data Types</h3>
                <p>Strings, integers, and floats</p>
            </div>
            <div class="lesson-icon" id="icon-lesson2">📘</div>
        </a>

        <!-- Lesson 3 -->
        <a href="lesson3.html" class="lesson-card" id="card-lesson3">
            <div class="lesson-info">
                <h3>3. Operators & Math</h3>
                <p>Addition, division, and BODMAS</p>
            </div>
            <div class="lesson-icon" id="icon-lesson3">📘</div>
        </a>

        <!-- Lesson 4 (Locked by Paywall) -->
        <div class="lesson-card locked">
            <div class="lesson-info">
                <h3>4. Input & Output</h3>
                <p>Needs unlock</p>
            </div>
            <div class="lesson-icon">🔒</div>
        </div>

    </div>

    <script src="nav.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        const SUPABASE_URL = "https://kbdchkkzoaoveryxzxdz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_ePAkGvIAevOmSg6wwn2BdA_PW9FRbhk";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadProgress() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) return;

            let { data: profile } = await supabaseClient.from('profiles').select('completed_lessons').eq('id', user.id).single();
            
            let completed = [];
            if (profile && profile.completed_lessons) {
                completed = profile.completed_lessons;
            }

            // Lesson 1 is always unlocked. Check completion for icon.
            if (completed.includes('lesson1')) {
                document.getElementById('icon-lesson1').innerText = '✅';
            }

            // Check if Lesson 1 is done to unlock Lesson 2
            if (completed.includes('lesson1')) {
                document.getElementById('card-lesson2').classList.remove('locked');
                if (completed.includes('lesson2')) {
                    document.getElementById('icon-lesson2').innerText = '✅';
                }
            } else {
                document.getElementById('card-lesson2').classList.add('locked');
                document.getElementById('icon-lesson2').innerText = '🔒';
            }

            // Check if Lesson 2 is done to unlock Lesson 3
            if (completed.includes('lesson2')) {
                document.getElementById('card-lesson3').classList.remove('locked');
                if (completed.includes('lesson3')) {
                    document.getElementById('icon-lesson3').innerText = '✅';
                }
            } else {
                document.getElementById('card-lesson3').classList.add('locked');
                document.getElementById('icon-lesson3').innerText = '🔒';
            }
        }

        // We need to wait for the DOM to load and Supabase to check auth
        document.addEventListener("DOMContentLoaded", function() {
            loadProgress();
        });
    </script>
</body>
</html>
